# Toko Kartini - Local Development Stack
# Pakai Docker Desktop untuk database lokal sebelum deploy ke Easypanel
# Run: docker compose up -d
# Stop: docker compose down
# Reset: docker compose down -v (hapus volume)

services:
  kartini-db:
    image: postgres:16-alpine
    container_name: kartini-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kartini_local_pass
      POSTGRES_DB: kartini
    ports:
      - "5434:5432"
    volumes:
      - kartini_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  kartini-redis:
    image: redis:7-alpine
    container_name: kartini-redis-local
    restart: unless-stopped
    command: redis-server --requirepass kartini_local_redis
    ports:
      - "6381:6379"
    volumes:
      - kartini_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a kartini_local_redis ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kartini_db_data:
  kartini_redis_data:
